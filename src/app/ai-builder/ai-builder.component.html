<div class="ai-builder" *ngIf="project">
  <div class="header">
    <h2>{{ project.name }}</h2>
    <div class="meta">
      {{ project.gazebo_version }} · SDF {{ project.sdf_version }} · ROS 2
      {{ project.ros2_distro }}
    </div>
    <button mat-button (click)="configureGazebo()" class="gz-btn">
      <mat-icon>link</mat-icon>
      <span class="gz-label">Gazebo: {{ gazeboStatusLabel }}</span>
    </button>
    <div class="spacer"></div>
    <button mat-button (click)="toggleHistory()">
      <mat-icon>history</mat-icon>
      {{ showHistory ? "Hide history" : "Versions" }}
    </button>
    <button mat-button (click)="toggleSDF()">
      <mat-icon>code</mat-icon> {{ showSDF ? "Hide SDF" : "Show SDF" }}
    </button>
    <button mat-button (click)="toggleExecution()">
      <mat-icon>terminal</mat-icon>
      {{ showExecution ? "Hide run" : "Run code" }}
    </button>
    <button mat-button (click)="saveVersion()" [disabled]="!worldSDF">
      <mat-icon>save</mat-icon> Save
    </button>
    <button mat-button [matMenuTriggerFor]="exportMenu">
      <mat-icon>file_download</mat-icon> Export
    </button>
    <mat-menu #exportMenu="matMenu">
      <button mat-menu-item (click)="downloadZip()">
        <mat-icon>folder_zip</mat-icon>Download ZIP
      </button>
      <button mat-menu-item (click)="pushToGitHub()">
        <mat-icon>cloud_upload</mat-icon>Push to GitHub
      </button>
    </mat-menu>
    <button mat-button (click)="clearChat()">
      <mat-icon>delete_sweep</mat-icon> Clear chat
    </button>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="layout">
    <!-- Left column: history sidebar (toggleable) + chat panel -->
    <div class="left-column">
      <ai-builder-version-history
        *ngIf="showHistory"
        class="history"
        [projectId]="project.id"
        (restore)="restoreVersion($event)"
      ></ai-builder-version-history>

      <div class="chat-panel">
        <div class="messages">
          <div
            *ngFor="let entry of log"
            class="message"
            [class.user]="entry.role === 'user'"
            [class.assistant]="entry.role === 'assistant'"
            [class.tool]="entry.role === 'tool'"
          >
            <div class="role">{{ entry.role }}</div>
            <div class="content">{{ entry.text }}</div>
          </div>
          <div *ngIf="currentAssistant" class="message assistant streaming">
            <div class="role">assistant</div>
            <div class="content">{{ currentAssistant }}</div>
          </div>
        </div>
        <div class="input">
          <textarea
            [(ngModel)]="draftMessage"
            rows="3"
            placeholder="Describe what you want to build, e.g. 'a warehouse with a forklift and an AMR'…"
            (keydown.control.enter)="sendMessage()"
            [disabled]="sending"
          ></textarea>
          <button
            mat-raised-button
            color="primary"
            (click)="sendMessage()"
            [disabled]="sending || !draftMessage.trim()"
          >
            <mat-icon>send</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Right column: viewport + optional SDF panel -->
    <div class="right-column">
      <ai-builder-viewport [sdf]="worldSDF"></ai-builder-viewport>

      <div class="sdf-panel" *ngIf="showSDF">
        <textarea
          [(ngModel)]="worldSDF"
          class="sdf-editor"
          spellcheck="false"
          placeholder="Generated SDF will appear here."
        ></textarea>
      </div>

      <ai-builder-execution-panel
        *ngIf="showExecution"
        class="exec-panel"
        [projectId]="project.id"
      ></ai-builder-execution-panel>
    </div>
  </div>
</div>
