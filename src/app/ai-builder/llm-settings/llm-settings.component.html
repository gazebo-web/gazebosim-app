<mat-card class="llm-settings">
  <mat-card-header>
    <mat-card-title>AI Builder · API Keys</mat-card-title>
    <mat-card-subtitle>
      Encrypted on the server, used only to proxy your AI Builder chats.
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="toolbar">
      <button mat-raised-button color="primary" (click)="addKey()">
        <mat-icon>add</mat-icon> Add Key
      </button>
    </div>

    <div *ngIf="loading" class="loading">Loading…</div>
    <div *ngIf="error" class="error">{{ error }}</div>

    <table class="keys" *ngIf="!loading">
      <thead>
        <tr>
          <th>Provider</th>
          <th>Created</th>
          <th>Key</th>
          <th class="actions"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let k of keys">
          <td>{{ providerLabel(k.provider) }}</td>
          <td>{{ k.created_at | date: "medium" }}</td>
          <td class="mono">{{ k.api_key_masked || "—" }}</td>
          <td class="actions">
            <button
              mat-icon-button
              aria-label="Delete key"
              (click)="deleteKey(k)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
        <tr *ngIf="keys.length === 0" class="empty-row">
          <td colspan="4">
            You haven't added any LLM API keys yet. Click
            <strong>Add Key</strong> to get started.
          </td>
        </tr>
      </tbody>
    </table>
  </mat-card-content>
</mat-card>
