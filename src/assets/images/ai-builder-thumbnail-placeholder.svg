<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1c2733"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="skewY(-15) skewX(45)">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3a4a5a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#grid)" opacity="0.6"/>
  <g fill="#9aa7b6" font-family="Roboto, system-ui, sans-serif" text-anchor="middle">
    <text x="160" y="92" font-size="14" font-weight="500" letter-spacing="1.5">EMPTY PROJECT</text>
    <text x="160" y="112" font-size="11" opacity="0.7">Save to generate a preview</text>
  </g>
</svg>
